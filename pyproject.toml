[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parking-occupancy"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
parking-audit = "parking_occupancy.pklot:main"

[tool.setuptools]
py-modules = ["parking_module"]
package-dir = {"" = ".", "parking_occupancy" = "src/parking_occupancy"}

[tool.setuptools.packages.find]
where = ["src"]
